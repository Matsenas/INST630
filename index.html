<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>INST630</title>
    <style>
      :root {
        --bg: #fefefe;
        --fg: #1f2328;
        --muted: #59636e;
        --accent: #2c5aa0;
        --card: #f6f8fa;
        --border: #d1d9e0;
      }

      body {
        padding: 3rem 1.5rem;
        background-color: var(--bg);
        color: var(--fg);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica,
          Arial, sans-serif;
        line-height: 1.6;
        max-width: 720px;
        margin: 0 auto;
      }

      header {
        border-bottom: 1px solid var(--accent);
        padding-bottom: 1rem;
        margin-bottom: 2.5rem;
      }

      h1 {
        margin: 0 0 0.25rem;
        font-size: 2rem;
      }

      h2 {
        font-size: 1.1rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--muted);
        margin-bottom: 1rem;
      }

      ul {
        list-style: none;
        padding: 0;
        margin: 0;
      }

      li + li {
        margin-top: 1rem;
      }

      article {
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 1rem 1.25rem;
        background-color: var(--card);
      }

      article h3 {
        margin: 0 0 0.25rem;
        font-size: 1.05rem;
      }

      article p {
        margin: 0;
        color: var(--muted);
        font-size: 0.95rem;
      }

      a {
        color: var(--accent);
      }

      a:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }
    </style>
  </head>

  <body>
    <header>
      <h1>INST630</h1>
    </header>

    <section>
      <h2>Tutorials</h2>
      <ul>
        <li>
          <article>
            <h3>
              <a href="tutorial_1/tutorial_1.html">
                Tutorial 1 — Marking up a letter
              </a>
            </h3>
            <p>
              Structuring a plain-text letter with semantic HTML: headings,
              lists, description lists, addresses, and inline semantics.
            </p>
          </article>
        </li>
      </ul>
    </section>
  </body>
</html>
